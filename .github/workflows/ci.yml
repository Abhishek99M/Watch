name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository and application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node scripts/check-repository.mjs
      - name: Install and validate application when present
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint
            npm run typecheck
            npm run test:rendering-compat
            node --test scripts/asset-equivalence.test.mjs
            node scripts/prepare-watch.mjs --check
            git diff --exit-code -- public/models/aurel-veil.glb public/models/watch.json docs/WATCH_ASSET_VALIDATION.json
            npm audit --audit-level=high
          else
            echo 'Documentation phase: application has not been created.' >> "$GITHUB_STEP_SUMMARY"
          fi

  browser:
    name: Browser (${{ matrix.mode }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [development, production]
        suite: [core, movement, craftsmanship, configuration]
    env:
      PLAYWRIGHT_SUITE: ${{ matrix.suite }}
      TEST_PRODUCTION: ${{ matrix.mode == 'production' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build production application
        if: matrix.mode == 'production'
        run: npm run build
      - name: Run browser suite
        run: npm test
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.mode }}-${{ matrix.suite }}-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install versioned Gitleaks and verify release checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/watch-gitleaks"
          cd "$RUNNER_TEMP/watch-gitleaks"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.24.3
          curl --fail --silent --show-error --location "$base/gitleaks_8.24.3_linux_x64.tar.gz" -o gitleaks_8.24.3_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$base/gitleaks_8.24.3_checksums.txt" -o checksums.txt
          grep ' gitleaks_8.24.3_linux_x64.tar.gz$' checksums.txt > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
      - name: Scan full Git history including the initial commit
        run: '"$RUNNER_TEMP/watch-gitleaks/gitleaks" git --redact --log-opts="--all" .'

  gate:
    name: Required checks
    if: always()
    needs: [quality, browser, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          BROWSER: ${{ needs.browser.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: test "$QUALITY" = success && test "$BROWSER" = success && test "$SECRETS" = success
